version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Type definitions track the runtime major (Node 22 in package.json
      # engines and the workflows). Bump them together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Held until the lint stack supports them: typescript-eslint (via
      # eslint-config-next) requires typescript <6.1, and eslint-config-next's
      # bundled import/react/jsx-a11y plugins declare eslint <=9. Remove these
      # entries when eslint-config-next supports TypeScript 7 and ESLint 10.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # The CodeQL init and analyze steps must move together.
      actions:
        patterns: ["*"]
