version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    # Wait until a release is 5 days old. Security updates are not delayed.
    cooldown:
      default-days: 5
    groups:
      # The @rjsf packages must move together (one PR), or npm ci fails.
      rjsf:
        patterns: ['@rjsf/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors are planned cross-app upgrade waves, not weekly PRs
      # (playbooks/dependabot.md in direwolfvm/operator). CI npm audit still catches anything hidden.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # The CodeQL init and analyze steps must move together.
      actions:
        patterns: ["*"]
